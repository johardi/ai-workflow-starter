<div id="template-list">
  {% if templates %}
  <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3">
    {% for t in templates %}
    <div class="group relative">
      <a href="{% url 'builder:builder' t.pk %}"
         class="block rounded-2xl border border-stone-200 bg-white p-5 shadow-sm transition duration-200 hover:-translate-y-0.5 hover:border-stone-300 hover:shadow-lg">
        <div class="mb-6 flex items-start justify-between gap-3 pr-8">
          <div class="min-w-0">
            <p class="mb-2 text-[0.65rem] font-semibold uppercase tracking-[0.22em] text-stone-400">Form Template</p>
            <h2 class="truncate text-lg font-semibold text-stone-900">{{ t.title|default:t.name }}</h2>
          </div>
          <span class="rounded-full bg-emerald-50 px-2.5 py-1 text-[0.65rem] font-medium uppercase tracking-wide text-emerald-700">v{{ t.version }}</span>
        </div>
        <div class="space-y-2 text-sm text-stone-500">
          <p class="font-mono text-xs text-stone-400">{{ t.name }}</p>
          <p>Updated {{ t.updated_at|timesince }} ago</p>
        </div>
      </a>

      <button type="button"
              hx-delete="{% url 'builder:delete' t.pk %}"
              hx-target="#template-list"
              hx-swap="outerHTML"
              hx-confirm="Delete this form template and all associated sections, fields, and enums?"
              onclick="event.preventDefault(); event.stopPropagation();"
              class="absolute right-3 top-3 inline-flex h-9 w-9 items-center justify-center rounded-full border border-stone-200 bg-white/95 text-stone-400 opacity-0 shadow-sm backdrop-blur transition duration-200 hover:border-red-200 hover:text-red-600 group-hover:opacity-100 focus:opacity-100 focus:outline-none focus:ring-2 focus:ring-red-200"
              aria-label="Delete {{ t.title|default:t.name }}">
        <i class="fa-solid fa-trash-can text-sm"></i>
      </button>
    </div>
    {% endfor %}
  </div>
  {% else %}
  <div class="rounded-3xl border border-dashed border-stone-300 bg-stone-50/80 px-6 py-20 text-center">
    <p class="mb-4 text-stone-500">No forms yet. Create your first one!</p>
  </div>
  {% endif %}
</div>
