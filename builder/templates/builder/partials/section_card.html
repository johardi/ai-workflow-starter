{% load builder_tags %}

<div class="section-card bg-white rounded-lg border border-stone-200 mb-4 shadow-sm" id="section-{{ section.pk }}"
     x-data="{ collapsed: false, editingTitle: false }">
  <!-- Section header -->
  <div class="flex items-center justify-between px-4 py-2.5 border-b border-stone-100 cursor-move section-handle">
    <div class="flex items-center gap-2">
      <span class="text-stone-300 cursor-move">::</span>
      <div x-show="!editingTitle" @dblclick="editingTitle = true"
           class="text-xs font-semibold text-stone-700 uppercase tracking-wide">
        {{ section.title|default:section.name }}
      </div>
      <input x-show="editingTitle" x-ref="sectionTitle"
             value="{{ section.title|escapejs }}"
             @blur="editingTitle = false"
             @keydown.enter="editingTitle = false"
             hx-put="{% url 'builder:section_update' template.pk section.pk %}"
             hx-trigger="blur"
             hx-target="#section-{{ section.pk }}"
             hx-swap="outerHTML"
             name="title"
             class="text-xs font-semibold border-b-2 border-amber-400 outline-none bg-transparent uppercase tracking-wide"
             x-init="$watch('editingTitle', v => { if(v) $nextTick(() => $refs.sectionTitle.focus()) })">
      {% if section.is_root %}
      <span class="text-[0.625rem] bg-emerald-50 text-emerald-600 px-1.5 py-0.5 rounded font-medium">root</span>
      {% endif %}
    </div>
    <div class="flex items-center gap-1">
      <button @click="collapsed = !collapsed" class="text-stone-400 hover:text-stone-600 text-xs transition">
        <span x-text="collapsed ? '+' : '&minus;'"></span>
      </button>
      {% if not section.is_root %}
      <button hx-delete="{% url 'builder:section_delete' template.pk section.pk %}"
              hx-target="#section-{{ section.pk }}"
              hx-swap="outerHTML"
              hx-confirm="Delete this section and all its fields?"
              class="text-stone-400 hover:text-red-500 text-xs ml-1 transition">&times;</button>
      {% endif %}
    </div>
  </div>

  <!-- Fields list -->
  <div x-show="!collapsed" class="pl-12 pr-3 py-3">
    <div id="section-fields-{{ section.pk }}" class="field-list space-y-2 min-h-[2rem]"
         data-section-id="{{ section.pk }}">
      {% for field in section.fields.all %}
        {% include "builder/partials/field_row.html" %}
      {% endfor %}
    </div>
  </div>
</div>
