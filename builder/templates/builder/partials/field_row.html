{% load builder_tags %}

<div id="field-{{ field.pk }}"
     class="field-row relative"
     data-field-id="{{ field.pk }}">

  <!-- Left popup menu (visible only when selected) -->
  <div class="field-actions">
    <button class="field-handle field-action-btn" title="Drag to reorder" @click.stop>
      <i class="fa-solid fa-grip-vertical text-xs"></i>
    </button>
    <button class="field-action-btn"
            title="Duplicate"
            hx-post="{% url 'builder:field_copy' template.pk field.section_id field.pk %}"
            hx-target="closest .field-row"
            hx-swap="afterend"
            @click.stop>
      <i class="fa-regular fa-copy text-xs"></i>
    </button>
    <button class="field-action-btn"
            title="Remove"
            hx-delete="{% url 'builder:field_detail' template.pk field.section_id field.pk %}"
            hx-target="#field-{{ field.pk }}"
            hx-swap="outerHTML"
            hx-confirm="Delete this field?"
            @click.stop="deselectField()">
      <i class="fa-solid fa-xmark text-xs"></i>
    </button>
  </div>

  <!-- Card body -->
  <div class="field-card flex items-start justify-between"
       hx-get="{% url 'builder:field_detail' template.pk field.section_id field.pk %}"
       hx-target="#config-panel"
       hx-swap="innerHTML"
       @click="selectField('{{ field.pk }}')">
    <div class="flex-1 min-w-0">
      <div class="text-sm font-medium text-stone-800">
        {{ field.title|default:field.name }}{% if field.required %}<span class="text-red-500 ml-0.5">*</span>{% endif %}
      </div>
      <div class="text-xs text-stone-400 mt-0.5 {% if not field.description %}italic{% endif %}">
        {{ field.description|default:"Add some help text" }}
      </div>
    </div>
    <div class="text-right flex-shrink-0 ml-4">
      <div class="text-xs text-stone-400 font-mono">{{ field.name }}</div>
      <div class="text-xs text-stone-500 font-medium mt-0.5">
        <i class="{{ field.range_type|field_icon_class }} mr-1 text-stone-400"></i>{{ field.get_range_type_display }}
      </div>
    </div>
  </div>
</div>
