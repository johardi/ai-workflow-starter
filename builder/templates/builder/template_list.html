{% extends "builder/base.html" %}
{% block title %}My Forms — LinkML Form Builder{% endblock %}

{% block body %}
<div class="max-w-5xl mx-auto py-10 px-4">
  <div class="flex items-center justify-between mb-8">
    <h1 class="text-2xl font-bold text-gray-900">My Forms</h1>
    <form method="post" action="{% url 'builder:create' %}">
      {% csrf_token %}
      <button type="submit"
              class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg font-medium transition">
        + New Form
      </button>
    </form>
  </div>

  {% include "builder/partials/template_list_content.html" %}
</div>
{% endblock %}
